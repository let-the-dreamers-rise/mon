[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = true
fs_permissions = [{ access = "read", path = "../tools/map" }]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[lint]
lint_on_build = false
